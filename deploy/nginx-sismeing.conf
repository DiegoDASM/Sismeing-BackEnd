# Bloque de servidor nginx para SISMEING.
#
# En un stack Bitnami, copiar a:
#   /opt/bitnami/nginx/conf/server_blocks/sismeing-server-block.conf
# y recargar:
#   sudo /opt/bitnami/ctlscript.sh restart nginx
#
# Sirve el frontend estatico y la API bajo el MISMO dominio. Esto es a proposito:
# al ser mismo origen, el navegador no dispara CORS y no hay que configurar
# Cors:AllowedOrigins ni mantener dos dominios sincronizados.

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com;

    # Certbot reescribira este bloque al emitir el certificado (ver la guia).
    # Tras hacerlo, nginx redirige solo el trafico HTTP a HTTPS.

    # ── Frontend: build de Vite (carpeta dist) ───────────────────────────────
    root /opt/sismeing/web;
    index index.html;

    # React Router maneja las rutas en el cliente. Sin try_files, entrar directo
    # a /dashboard o recargar la pagina devolveria 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre no cambian nunca: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NO se cachea: si no, tras desplegar el navegador seguiria
    # pidiendo los assets viejos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API: proxy inverso a Kestrel ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin esta cabecera la app cree que todo llega por HTTP plano.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;

        # Los informes y las subidas a Cloudinary pueden tardar: el timeout
        # por defecto (60s) se queda corto en la primera generacion.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Las fotos se suben a Cloudinary a traves de la API: el limite por defecto
    # de nginx (1 MB) rechazaria cualquier foto de movil.
    client_max_body_size 25M;

    # Cabeceras de seguridad basicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
